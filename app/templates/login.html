{% extends "base.html" %}
{% block content %}

<div class="ds-login-shell">
  <div class="ds-login-card">

    <div class="ds-login-card__header">
      <img src="{{ url_for('static', filename='assets/logo_datascope_sized.png') }}" alt="DataScope" width="80" height="68">
      <h1 class="ds-login-card__title">
        {% if language == "fr" %}Connectez-vous{% else %}Log In{% endif %}
      </h1>
    </div>

    {% if error %}
      <div class="ds-alert ds-alert--error" role="alert" id="login-error" style="text-align: center;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      <div class="ds-form-group">
        <label for="email" class="ds-label">
          {% if language == "fr" %}Adresse email{% else %}Email address{% endif %}
        </label>
        <input type="email" id="email" name="email" class="ds-input" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="ds-btn ds-btn--primary ds-btn--lg" style="width: 100%; justify-content: center;">
        {% if language == "fr" %}Se connecter{% else %}Log in{% endif %}
      </button>
    </form>

  </div>
</div>

{% endblock %}
